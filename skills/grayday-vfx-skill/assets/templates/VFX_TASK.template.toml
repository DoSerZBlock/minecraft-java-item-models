[project]
id = "example_vfx"
name = "Example VFX"
vfx_family = "projectile"
minecraft_version = "26.2"
phase = "blockout"

[design]
theme = "dark_medieval_fantasy"
element = "arcane"
primary_silhouette = "one readable dominant form"
focal_point = "one controlled luminous accent"
detail_density = "low_to_medium"

[spatial]
spawn_space = "caster_space"
orientation_space = "velocity_space"
target_space = "world_space"

[geometry]
units = "blockbench_units"
asset_forward_axis = "+z"
asset_up_axis = "+y"
origin = "rear_center"
max_extent = 32.0

[orientation]
runtime_forward_source = "velocity"
follow_yaw = true
follow_pitch = true
follow_roll = false
invert_forward = false

[motion]
type = "linear_projectile"
initial_speed_blocks_per_tick = 1.0
acceleration_blocks_per_tick2 = 0.0
max_distance_blocks = 24.0

[timeline]
cast_start_sec = 0.0
release_sec = 0.20
impact_trigger = "collision"
aftermath_duration_sec = 0.30

[lifecycle]
max_lifetime_ticks = 60
dispose_on_impact = true
dispose_on_cancel = true
dispose_on_disconnect = true
dispose_on_shutdown = true

[effects.cast]
particle_id = "grayday:example_cast"
sound_id = "grayday:example_cast"

[effects.flight]
particle_id = "grayday:example_trail"

[effects.impact]
particle_id = "grayday:example_impact"
sound_id = "grayday:example_impact"

[budget]
max_models_per_cast = 1
max_particles_per_tick = 24
max_active_instances_per_player = 4
max_lifetime_ticks = 60
allow_per_viewer_particles = true

[runtime]
presentation_runtime = "GrayDay_VFX"
model_provider = "BetterModel"
asset_source = "GrayDay_Assets"
rpg_domain_source = "GrayDay_Core"
model_id = "grayday:example_vfx"

[output]
expected = [
  "GrayDay_Assets model/texture source",
  "GrayDay_VFX presentation definition/integration",
  "Paper runtime QA evidence"
]

[qa]
required_cases = [
  "horizontal",
  "pitch_up",
  "pitch_down",
  "side_observation",
  "impact",
  "timeout",
  "disconnect",
  "cleanup"
]
blocking_rules = [
  "forward axis must match runtime forward vector",
  "pitch must be preserved when follow_pitch is true",
  "all terminal paths must cleanup"
]
paper_runtime_qa = "pending"
